services:
  - type: web
    name: manisoft-lumina
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --worker-class gthread -w 1 --threads 16 --max-requests 2000 --max-requests-jitter 200 --backlog 2048 --keep-alive 5 --bind 0.0.0.0:$PORT app:app --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: SECRET_KEY
        generateValue: true
      - key: TEACHER_KEY
        value: LUMINA_EDU_2026
      - key: PORT
        value: "10000"
      - key: FLASK_ENV
        value: production
