{% extends "base.html" %}
{% block title %}Reaction Test - Lumina{% endblock %}
{% block content %}
<div class="game-container">
    <h1>⚡ Reaction Test</h1>
    <p>Click the box as soon as it turns green. 5 attempts.</p>
    <div id="reaction-box" class="reaction-box" role="button" tabindex="0" aria-label="Reaction target">Wait...</div>
    <div class="game-meta">
        <span id="react-attempt">Attempt 1/5</span>
        <span id="react-best">Best: —</span>
        <span id="react-avg">Avg: —</span>
    </div>
    <div id="react-results" class="results-panel" style="display:none">
        <div class="stat-grid">
            <div class="stat"><div class="stat-value" id="react-final-best">0</div><div class="stat-label">Best (ms)</div></div>
            <div class="stat"><div class="stat-value" id="react-final-avg">0</div><div class="stat-label">Average (ms)</div></div>
        </div>
    </div>
</div>
<script>
(function(){
    const box = document.getElementById('reaction-box');
    const attemptEl = document.getElementById('react-attempt');
    const bestEl = document.getElementById('react-best');
    const avgEl = document.getElementById('react-avg');
    let attempts = [], state = 'idle', startTime = 0, timerId = null, attemptNum = 0;
    function reset() {
        if (attempts.length >= 5) {
            box.textContent = 'Done!';
            box.className = 'reaction-box';
            document.getElementById('react-results').style.display = 'block';
            const best = attempts.length ? Math.min(...attempts) : 300;
            const avg = attempts.length ? Math.round(attempts.reduce((a,b)=>a+b,0)/attempts.length) : 350;
            document.getElementById('react-final-best').textContent = best;
            document.getElementById('react-final-avg').textContent = avg;
            if (typeof LuminaAudio !== 'undefined') LuminaAudio.gameWin();
            fetch('/submit/reaction', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({best_ms: best, avg_ms: avg, attempts: attempts.length})
            });
            return;
        }
        state = 'waiting'; box.textContent = 'Wait...'; box.className = 'reaction-box waiting';
        attemptEl.textContent = 'Attempt ' + (attempts.length + 1) + '/5';
        const delay = 1000 + Math.random() * 3000;
        timerId = setTimeout(() => {
            state = 'ready'; box.textContent = 'CLICK!'; box.className = 'reaction-box ready'; startTime = Date.now();
        }, delay);
    }
    box.addEventListener('click', () => {
        if (state === 'idle') { reset(); }
        else if (state === 'waiting') {
            clearTimeout(timerId);
            box.textContent = 'Too early! Click to retry.';
            box.className = 'reaction-box';
            state = 'idle';
            if (typeof LuminaAudio !== 'undefined') LuminaAudio.keyWrong();
        }
        else if (state === 'ready') {
            const ms = Date.now() - startTime; attempts.push(ms);
            box.textContent = ms + 'ms'; box.className = 'reaction-box';
            const best = Math.min(...attempts);
            const avg = Math.round(attempts.reduce((a,b)=>a+b,0)/attempts.length);
            bestEl.textContent = 'Best: ' + best + 'ms'; avgEl.textContent = 'Avg: ' + avg + 'ms';
            if (typeof LuminaAudio !== 'undefined') LuminaAudio.keyCorrect();
            state = 'idle'; setTimeout(reset, 800);
        }
    });
    box.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') box.click(); });
})();
</script>
{% endblock %}
