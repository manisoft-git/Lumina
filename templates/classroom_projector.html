<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Projector Arena — Lumina</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='socket.io.min.js') }}"></script>
    <script src="{{ url_for('static', filename='sound.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <style>
        body {
            background: #060911;
            color: #f8fafc;
            overflow-x: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0; padding: 0;
        }
        .projector-container {
            padding: 24px 36px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .arena-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(56,189,248,0.3);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }
        .arena-brand {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #38bdf8, #4ade80);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .arena-meta {
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .room-pill {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148,163,184,0.3);
            padding: 8px 18px;
            border-radius: 24px;
            font-weight: 700;
            font-size: 1.1rem;
            color: #38bdf8;
        }
        .fullscreen-btn {
            background: rgba(56,189,248,0.2);
            border: 1px solid #38bdf8;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Race Tracks */
        .tracks-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 28px;
        }
        .track-lane {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(148,163,184,0.2);
            border-radius: 12px;
            padding: 12px 20px;
            position: relative;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .track-lane.finished {
            border-color: #4ade80;
            background: rgba(74,222,128,0.08);
        }
        .lane-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 1.15rem;
            margin-bottom: 10px;
        }
        .student-avatar {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .stats-badge {
            font-size: 1rem;
            font-family: monospace;
            background: rgba(0,0,0,0.4);
            padding: 4px 12px;
            border-radius: 6px;
            color: #4ade80;
        }

        .lane-progress-bg {
            height: 24px;
            background: rgba(30, 41, 59, 0.9);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .lane-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #0284c7, #38bdf8, #4ade80);
            border-radius: 12px;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .lane-runner {
            position: absolute;
            right: -14px;
            top: -5px;
            font-size: 1.4rem;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            transition: transform 0.2s;
        }

        /* Podium Overlay */
        .podium-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .podium-card {
            background: #0f172a;
            border: 2px solid #38bdf8;
            border-radius: 18px;
            padding: 40px;
            max-width: 650px;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 48px rgba(56,189,248,0.4);
        }
        .podium-title {
            font-size: 2.4rem;
            font-weight: 900;
            margin-bottom: 20px;
            color: #fbbf24;
        }
        .podium-ranks {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 28px 0;
        }
        .podium-slot {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148,163,184,0.3);
            border-radius: 12px;
            padding: 20px 16px;
            flex: 1;
        }
        .slot-1 { border-color: #fbbf24; transform: translateY(-12px); background: rgba(251,191,36,0.1); }
        .slot-2 { border-color: #cbd5e1; }
        .slot-3 { border-color: #d97706; }
        .slot-crown { font-size: 2.2rem; }
        .slot-user { font-weight: 800; font-size: 1.15rem; margin-top: 8px; }
        .slot-wpm { font-size: 1.3rem; font-weight: 900; color: #38bdf8; margin-top: 4px; }

        .empty-arena {
            text-align: center;
            padding: 80px 20px;
            color: #94a3b8;
            font-size: 1.3rem;
        }
    </style>
</head>
<body>

<div class="projector-container">
    <div class="arena-header">
        <div>
            <div class="arena-brand">⚡ LUMINA LIVE ARENA</div>
            <div style="font-size: 0.95rem; color: #94a3b8;">Classroom Projector Mode • Real-Time Keystroke Telemetry</div>
        </div>
        <div class="arena-meta">
            <div class="room-pill">Room: <span id="room-display">{{ room_id }}</span></div>
            <button class="fullscreen-btn" onclick="toggleFullScreen()">⛶ Fullscreen</button>
            <button class="fullscreen-btn" id="audio-toggle-btn" onclick="toggleSound()">🔊 Audio On</button>
        </div>
    </div>

    <div id="tracks-area" class="tracks-container">
        <div class="empty-arena" id="empty-state">
            <div style="font-size: 3rem; margin-bottom: 12px;">📡</div>
            Waiting for students to join room <strong style="color:#38bdf8;">{{ room_id }}</strong>...
        </div>
    </div>
</div>

<!-- Podium Modal -->
<div class="podium-modal" id="podium-modal">
    <div class="podium-card">
        <div class="podium-title">🏆 RACE COMPLETE!</div>
        <div class="podium-ranks" id="podium-ranks"></div>
        <button class="fullscreen-btn" onclick="closePodium()" style="font-size:1.1rem; padding:10px 24px;">Close Podium</button>
    </div>
</div>

<script>
const roomId = {{ room_id | tojson }};
const socket = io();
let soundEnabled = true;
const players = {};
const avatars = ['🚀', '⚡', '🏎️', '🦊', '🦅', '🎯', '👾', '🔥'];

function toggleFullScreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen().catch(() => {});
    }
}

function toggleSound() {
    soundEnabled = !soundEnabled;
    document.getElementById('audio-toggle-btn').textContent = soundEnabled ? '🔊 Audio On' : '🔇 Muted';
}

socket.emit('join_spectator', { room_id: roomId, game_type: 'typing' });

socket.on('spectator_joined', () => {
    console.log('[Projector] Joined spectator room for:', roomId);
});

socket.on('spectator_state', (data) => {
    if (!data || !data.players) return;
    updateAllPlayers(data.players);
});

socket.on('spectator_update', (data) => {
    if (!data || !data.players) return;
    updateAllPlayers(data.players);
});

socket.on('player_update', (data) => {
    if (!data || !data.sid) return;
    updateSinglePlayer(data);
});

socket.on('spectator_finished', (data) => {
    if (data && data.results) {
        showPodium(data.results);
    }
});

function getOrCreateLane(sid, username) {
    const tracksArea = document.getElementById('tracks-area');
    const emptyState = document.getElementById('empty-state');
    if (emptyState) emptyState.style.display = 'none';

    if (!players[sid]) {
        const avatar = avatars[Object.keys(players).length % avatars.length];
        const lane = document.createElement('div');
        lane.className = 'track-lane';
        lane.id = 'lane-' + sid;
        lane.innerHTML = `
            <div class="lane-info">
                <span class="student-avatar">${avatar} <span>${username}</span></span>
                <span class="stats-badge" id="stats-${sid}">0 WPM • 100%</span>
            </div>
            <div class="lane-progress-bg">
                <div class="lane-progress-fill" id="fill-${sid}">
                    <span class="lane-runner">${avatar}</span>
                </div>
            </div>
        `;
        tracksArea.appendChild(lane);
        players[sid] = { lane, avatar, username, finished: false };
    }
    return players[sid];
}

function updateSinglePlayer(data) {
    const p = getOrCreateLane(data.sid, data.username || 'Student');
    const fill = document.getElementById('fill-' + data.sid);
    const stats = document.getElementById('stats-' + data.sid);
    const progress = Math.min(100, Math.max(0, data.progress || 0));

    if (fill) fill.style.width = progress + '%';
    if (stats) stats.textContent = `${Math.round(data.wpm || 0)} WPM • ${Math.round(data.accuracy || 100)}%`;

    if (progress >= 100 && !p.finished) {
        p.finished = true;
        p.lane.classList.add('finished');
        if (typeof confetti === 'function') {
            confetti({ particleCount: 40, spread: 60, origin: { y: 0.8 } });
        }
        if (soundEnabled && typeof LuminaAudio !== 'undefined') {
            LuminaAudio.gameWin();
        }
    }
}

function updateAllPlayers(playerMap) {
    for (const sid in playerMap) {
        const d = playerMap[sid];
        updateSinglePlayer({
            sid: sid,
            username: d.username,
            progress: d.progress,
            wpm: d.wpm,
            accuracy: d.accuracy
        });
    }
}

function showPodium(results) {
    if (!results || !results.length) return;
    const sorted = [...results].sort((a,b) => (b.wpm || 0) - (a.wpm || 0));
    const ranksArea = document.getElementById('podium-ranks');
    ranksArea.innerHTML = '';

    const medals = ['🥇', '🥈', '🥉'];
    const slotClasses = ['slot-1', 'slot-2', 'slot-3'];

    sorted.slice(0, 3).forEach((r, idx) => {
        const slot = document.createElement('div');
        slot.className = 'podium-slot ' + (slotClasses[idx] || '');
        slot.innerHTML = `
            <div class="slot-crown">${medals[idx] || '🎖️'}</div>
            <div class="slot-user">${r.username}</div>
            <div class="slot-wpm">${Math.round(r.wpm)} WPM</div>
            <div style="font-size:0.85rem; color:#94a3b8; margin-top:2px;">${Math.round(r.accuracy || 100)}% ACC</div>
        `;
        ranksArea.appendChild(slot);
    });

    document.getElementById('podium-modal').style.display = 'flex';
    if (typeof confetti === 'function') {
        confetti({ particleCount: 120, spread: 90, origin: { y: 0.5 } });
    }
    if (soundEnabled && typeof LuminaAudio !== 'undefined') {
        LuminaAudio.gameWin();
    }
}

function closePodium() {
    document.getElementById('podium-modal').style.display = 'none';
}
</script>
</body>
</html>
