{% extends "base.html" %}
{% block title %}🔒 Producer Access - Lumina{% endblock %}
{% block head %}
<style>
.gatekeeper-container {
    max-width: 460px;
    margin: 80px auto;
    background: var(--surface);
    padding: 40px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    text-align: center;
    position: relative;
    overflow: hidden;
}
.gatekeeper-container::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--primary), var(--accent));
}
.gatekeeper-icon {
    font-size: 3.5rem;
    margin-bottom: 18px;
    display: inline-block;
    animation: lockPulse 2s ease infinite;
}
@keyframes lockPulse {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px var(--primary-glow)); }
    50% { transform: scale(1.08); filter: drop-shadow(0 0 20px var(--primary-glow)); }
}
.gatekeeper-title {
    font-size: 1.5rem;
    font-weight: 800;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.gatekeeper-subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 28px;
}
.gatekeeper-form {
    display: flex;
    flex-direction: column;
    gap: 14px;
}
.gatekeeper-form input {
    padding: 14px 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 1rem;
    font-family: 'Courier New', monospace;
    text-align: center;
    letter-spacing: 1px;
    transition: all 0.2s;
}
.gatekeeper-form input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-glow);
}
.gatekeeper-form button {
    padding: 12px;
    font-size: 1rem;
    font-weight: 700;
}
.gatekeeper-hint {
    margin-top: 18px;
    font-size: 0.78rem;
    color: var(--muted);
}
.beam-text {
    display: inline-block;
    animation: beamPulse 1.2s ease infinite;
    color: var(--primary);
    font-weight: 800;
}
</style>
{% endblock %}
{% block content %}
<div class="gatekeeper-container">
    <div class="gatekeeper-icon">🔒</div>
    <h1 class="gatekeeper-title" style="font-family:var(--term-font,monospace);">🔒 PRODUCER ACCESS</h1>
    <p class="gatekeeper-subtitle">Restricted diagnostics terminal. Enter your console key to proceed.</p>
    <form method="POST" action="{{ url_for('producer_panel') }}" class="gatekeeper-form">
        <input type="password" name="console_key" placeholder="••••••••••••••••" required autocomplete="off" autofocus>
        <button type="submit" class="btn btn-primary">Unlock <span class="beam-text">[./]</span></button>
    </form>
    <p class="gatekeeper-hint">Authorized console credentials required.</p>
</div>
{% endblock %}
