{% extends "base.html" %}
{% block title %}Forgot Password - Lumina{% endblock %}
{% block content %}
<div class="auth-container">
    <h1>Reset Password</h1>
    <p style="color:var(--muted);margin-bottom:18px;">Enter your email and we'll send a reset link.</p>
    <form method="POST" action="{{ url_for('forgot_password') }}" class="auth-form">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="tobi585olive@gmail.com" required autocomplete="email">
        <button type="submit" class="btn btn-primary">Send Reset Link</button>
    </form>
    <p><a href="{{ url_for('login') }}">Back to Login</a></p>
</div>
{% endblock %}
