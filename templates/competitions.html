{% extends "base.html" %}
{% block title %}Typing Race - Lumina{% endblock %}
{% block content %}
<div class="comp-page">
    <div class="comp-main">
        <div class="comp-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px;">
            <div>
                <h1 style="margin:0;">Typing Race — Room: {{ room_id }}</h1>
                <div id="comp-status" class="status-badge" style="margin-top:6px;">Waiting for players...</div>
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
                <button id="ready-btn" class="btn btn-primary" onclick="setReady()">⚡ Ready to Race</button>
                <a href="{{ url_for('competitions_hub') }}" class="btn btn-secondary">Leave</a>
            </div>
        </div>
        <div id="comp-arena" class="typing-arena" role="application" aria-label="Typing race area" onclick="if(!document.getElementById('comp-input').disabled) document.getElementById('comp-input').focus()">
            <div id="comp-passage" class="passage-display"></div>
            <input type="text" id="comp-input" class="hidden-input" style="position:absolute; opacity:0; pointer-events:none; width:0; height:0; border:none; padding:0; margin:0; outline:none; z-index:-999;" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Type here" disabled>
        </div>
        <div id="comp-results" style="display:none" class="results-panel" role="region" aria-label="Race results">
            <h2>Race Results</h2>
            <ol id="results-list"></ol>
        </div>
        <div id="progress-area" class="progress-area" aria-live="polite"></div>
    </div>
    <aside class="comp-chat" role="complementary" aria-label="Room chat">
        <h3>Room Chat</h3>
        <div id="chat-log" class="chat-log" role="log" aria-live="polite" aria-relevant="additions"></div>
        <form id="chat-form" class="chat-form">
            <input type="text" id="chat-input" placeholder="Say something..." maxlength="500" aria-label="Chat message">
            <button type="submit" class="btn btn-small">Send</button>
        </form>
    </aside>
</div>
{% endblock %}
{% block scripts %}
<script>
(function(){
    const roomId = {{ room_id | tojson }};
    const passage = {{ passage | tojson }};
    const socket = window.LUMINA_SOCKET || io({ transports: ['websocket', 'polling'] });
    const statusEl = document.getElementById('comp-status');
    const display = document.getElementById('comp-passage');
    const input = document.getElementById('comp-input');
    const progressArea = document.getElementById('progress-area');
    const resultsPanel = document.getElementById('comp-results');
    const resultsList = document.getElementById('results-list');
    const chatLog = document.getElementById('chat-log');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    let startTime = null, mySid = null, finished = false;

    function renderPassage() {
        display.innerHTML = '';
        passage.split('').forEach((ch, i) => {
            const s = document.createElement('span');
            s.textContent = ch; s.className = 'char'; s.dataset.i = i;
            display.appendChild(s);
        });
    }
    renderPassage();

    socket.on('connect', () => {
        console.log('Competition socket connected');
        statusEl.textContent = 'Connected. Joining room...';
        socket.emit('join_typing_room', {room_id: roomId, passage: passage});
        socket.emit('join_room_chat', {room: roomId});
    });

    socket.on('connect_error', (err) => {
        console.error('Socket error:', err);
        statusEl.textContent = 'Connection failed — refresh';
    });

    socket.on('room_state', (state) => { updateProgress(state.players); });

    window.setReady = function() {
        const btn = document.getElementById('ready-btn');
        if (btn) {
            btn.disabled = true;
            btn.textContent = '✓ Ready!';
            btn.style.background = '#10b981';
        }
        socket.emit('typing_ready', {room_id: roomId});
        statusEl.textContent = 'Ready! Waiting for opponent...';
    };

    socket.on('ready_update', (d) => {
        statusEl.textContent = `Players Ready: ${d.ready_count} / ${d.total}`;
    });

    socket.on('countdown', (d) => {
        statusEl.textContent = 'Race starting in: ' + d.value + '...';
        statusEl.classList.add('racing');
    });

    socket.on('race_start', (d) => {
        statusEl.textContent = '⚡ GO! RACE IN PROGRESS!';
        input.disabled = false; input.focus(); startTime = d.start_time;
    });

    socket.on('player_update', (d) => {
        const bar = document.getElementById('prog-' + d.sid);
        if (bar) {
            bar.style.width = d.progress + '%';
            bar.querySelector('.prog-label').textContent = d.username + ' ' + d.progress + '% (' + Math.round(d.wpm) + ' WPM)';
        } else {
            createBar(d.sid, d.username, d.progress, d.wpm);
        }
    });

    socket.on('race_finished', (d) => {
        input.disabled = true; finished = true; statusEl.textContent = 'Finished';
        resultsPanel.style.display = 'block';
        resultsList.innerHTML = '';
        d.results.forEach((r, i) => {
            const li = document.createElement('li');
            li.textContent = (i+1) + '. ' + r.username + ' — ' + Math.round(r.wpm) + ' WPM, ' + Math.round(r.accuracy) + '% acc';
            resultsList.appendChild(li);
        });
    });

    socket.on('room_message', (m) => {
        const div = document.createElement('div'); div.className = 'chat-msg';
        const strong = document.createElement('strong');
        strong.textContent = (m.username || 'Anon') + ': ';
        const span = document.createElement('span');
        span.textContent = m.message || '';
        div.appendChild(strong);
        div.appendChild(span);
        chatLog.appendChild(div); chatLog.scrollTop = chatLog.scrollHeight;
    });

    function createBar(sid, name, progress, wpm) {
        const wrap = document.createElement('div'); wrap.className = 'prog-wrap'; wrap.id = 'wrap-' + sid;
        wrap.innerHTML = '<div class="prog-bar" id="prog-' + sid + '" style="width:' + progress + '%"><span class="prog-label">' + name + ' ' + progress + '%</span></div>';
        progressArea.appendChild(wrap);
    }

    function updateProgress(players) {
        progressArea.innerHTML = '';
        Object.entries(players).forEach(([sid, p]) => createBar(sid, p.username, p.progress || 0, p.wpm || 0));
    }

    input.addEventListener('input', () => {
        if (finished || !startTime) return;
        const val = input.value;
        const progress = Math.min(100, Math.round((val.length / passage.length) * 100));
        let errs = 0;
        for (let i=0;i<val.length;i++) if (val[i] !== passage[i]) errs++;
        const elapsed = (Date.now()/1000 - startTime) / 60;
        const gross = val.length / 5 / Math.max(elapsed, 0.001);
        const acc = val.length > 0 ? ((val.length - errs) / val.length) * 100 : 100;
        socket.emit('progress_update', {room_id: roomId, progress: progress, wpm: gross, accuracy: acc});
        if (val.length >= passage.length) {
            finished = true; input.disabled = true;
            const net = Math.max(0, gross - (errs / Math.max(elapsed, 0.001)));
            socket.emit('race_complete', {room_id: roomId, wpm: gross, accuracy: acc, net_wpm: net});
            fetch('/submit_score', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({wpm: gross, accuracy: acc, errors: errs, net_wpm: net, room_id: roomId, category: 'competition', error_map: {}})
            });
        }
        display.querySelectorAll('.char').forEach((s,i)=>{
            s.classList.remove('correct','incorrect','current');
            if (i < val.length) s.classList.add(val[i]===passage[i]?'correct':'incorrect');
            else if (i === val.length) s.classList.add('current');
        });
    });

    chatForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const msg = chatInput.value.trim();
        if (msg) { socket.emit('room_message', {room: roomId, message: msg}); chatInput.value = ''; }
    });

    document.addEventListener('click', () => { if (!finished && !input.disabled) input.focus(); });
})();
</script>
{% endblock %}
