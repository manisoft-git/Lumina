{% extends "base.html" %}
{% block title %}Login - Lumina{% endblock %}
{% block content %}
<div class="auth-container">
    <h1>Welcome Back</h1>
    <form method="POST" action="{{ url_for('login') }}" class="auth-form">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="tobiolive5850" required autocomplete="username">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        <button type="submit" class="btn btn-primary" style="margin-top:14px;">Login</button>
    </form>
    <p>Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
    <p><a href="{{ url_for('forgot_password') }}">Forgot password?</a></p>
</div>
{% endblock %}
