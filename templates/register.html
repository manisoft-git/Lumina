{% extends "base.html" %}
{% block title %}Register - Lumina{% endblock %}
{% block content %}
<div class="auth-container">
    <h1>Create Account</h1>
    <form method="POST" action="{{ url_for('register') }}" class="auth-form">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="e.g. subenom or scholar10" required>
        <label for="fullname">Full Name (Surname First)</label>
        <input type="text" id="fullname" name="fullname" placeholder="Surname Firstname (e.g. Subeno Manifest)" required>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="name@school.edu" required>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6">
        <label for="role">Account Type</label>
        <select id="role" name="role" onchange="document.getElementById('teacher-key-group').style.display = this.value=='teacher'?'block':'none'">
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
        </select>
        <div id="teacher-key-group" style="display:none">
            <label for="teacher_key">Teacher Key</label>
            <input type="password" id="teacher_key" name="teacher_key">
        </div>
        <button type="submit" class="btn btn-primary">Register</button>
    </form>
    <p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</div>
{% endblock %}
